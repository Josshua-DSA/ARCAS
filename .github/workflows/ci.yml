name: CI

on:
  push:
    branches:
      - main
      - jeje
      - CI/CD
      - "backend/**"
      - "feature/**"
      - "fix/**"
      - "ci/**"
      - "CI/**"
  pull_request:
    branches:
      - main
      - jeje
      - CI/CD
  workflow_dispatch:

# Batalkan run lama untuk ref yang sama: hemat kuota, dan hasil yang
# dilaporkan selalu dari commit terakhir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin versi alat supaya hasil lint/type-check tidak berubah diam-diam
          # saat upstream merilis versi baru (ruff/mypy cukup sering menambah
          # aturan baru yang membuat CI merah tanpa perubahan kode).
          pip install -r requirements.txt
          pip install "ruff==0.17.0" "mypy==1.11.2"

      - name: Lint with ruff
        # RULES §4 mewajibkan ruff + mypy bersih sebelum merge.
        run: ruff check .

      - name: Type-check with mypy
        run: mypy

      - name: Latih baseline sentimen
        # Artefak .joblib sengaja TIDAK di-commit: hasil pickling sklearn
        # terikat versi Python & scikit-learn, jadi lebih aman dilatih ulang.
        # Dataset gold_sinha ikut ter-commit, jadi langkah ini deterministik.
        run: python -m model.common.train_baseline

      - name: Run test suite
        # `--timeout` belum tentu tersedia; batas waktu ditangani
        # `timeout-minutes` job + durasi suite yang ~13 detik.
        run: pytest

      - name: Pastikan test tidak diam-diam di-skip
        # Skip karena "latih dulu" berarti artefak model tidak terbentuk dan
        # suite kehilangan cakupan tanpa gagal. Angka 1 yang diizinkan adalah
        # `test_dedup.py` yang bergantung pada isi data/finews.db (tidak
        # di-commit, jadi memang tak bisa dijamin).
        run: |
          echo "Maksimum 5 test boleh skip; lebih dari itu berarti ada yang salah."
          pytest -q -rs 2>&1 | tee /tmp/pytest.log
          skipped=$(grep -c "^SKIPPED" /tmp/pytest.log || true)
          echo "jumlah skip: $skipped"
          if [ "$skipped" -gt 5 ]; then
            echo "::error::$skipped test di-skip, melebihi batas 5."
            exit 1
          fi

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: test-and-lint
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: arcas-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
