<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-label="Ilustrasi suku bunga: kurva imbal hasil menanjak">
  <defs>
    <linearGradient id="rtArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2727" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2C2727" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="320" height="400" fill="#EAE7E4"/>

  <!-- Kisi -->
  <g stroke="#2C2727" stroke-width="1" opacity="0.10">
    <line x1="52" y1="112" x2="272" y2="112"/>
    <line x1="52" y1="164" x2="272" y2="164"/>
    <line x1="52" y1="216" x2="272" y2="216"/>
    <line x1="52" y1="268" x2="272" y2="268"/>
  </g>
  <!-- Sumbu -->
  <g stroke="#2C2727" stroke-width="1.5" opacity="0.55">
    <line x1="52" y1="88" x2="52" y2="296"/>
    <line x1="52" y1="296" x2="272" y2="296"/>
  </g>

  <!-- Area di bawah kurva -->
  <path d="M52 272 L107 246 L162 252 L217 208 L272 148 L272 296 L52 296 Z" fill="url(#rtArea)"/>

  <!-- Kurva imbal hasil -->
  <path d="M52 272 L107 246 L162 252 L217 208 L272 148"
        fill="none" stroke="#2C2727" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Titik tenor -->
  <g fill="#F6F4F4" stroke="#2C2727" stroke-width="2.5">
    <circle cx="52" cy="272" r="4.5"/>
    <circle cx="107" cy="246" r="4.5"/>
    <circle cx="162" cy="252" r="4.5"/>
    <circle cx="217" cy="208" r="4.5"/>
    <circle cx="272" cy="148" r="4.5"/>
  </g>

  <!-- Ujung kurva ditandai titik, tanpa panah: tren sudah terbaca dari garis -->
  <circle cx="272" cy="148" r="3.5" fill="#C2410C"/>

  <!-- Label tenor, sejajar titik -->
  <g font-family="ui-monospace,monospace" font-size="10" fill="#5E5757" opacity="0.9"
     text-anchor="middle">
    <text x="52" y="316">2Th</text>
    <text x="107" y="316">5Th</text>
    <text x="162" y="316">10Th</text>
    <text x="217" y="316">20Th</text>
    <text x="272" y="316">30Th</text>
  </g>
</svg>
