[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finews"
version = "0.5.0"
description = "Financial News Sentiment & Market Association System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "FinNews Contributors" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "backend/tests",
]
pythonpath = [
    ".",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
