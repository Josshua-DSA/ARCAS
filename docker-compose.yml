services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcas-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # `.env` sengaja TIDAK ikut ke dalam image (.dockerignore) supaya kunci
      # API tidak pernah tertanam di layer. Nilainya disuntikkan saat runtime
      # dari `.env` di host lewat `env_file`. Tanpa ini, container berjalan
      # tanpa kunci dan ingest berita gagal senyap.
      - ARCAS_DISABLE_SCHEDULER=${ARCAS_DISABLE_SCHEDULER:-1}
    env_file:
      - path: .env
        required: false
    volumes:
      # Mount data folder untuk persistensi basis data SQLite dan konfigurasi
      - ./data:/app/data
      # Mount outputs untuk persistensi artefak laporan
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
