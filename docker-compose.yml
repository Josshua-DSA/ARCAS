services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcas-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      # Mount data folder untuk persistensi basis data SQLite dan konfigurasi
      - ./data:/app/data
      # Mount outputs untuk persistensi artefak laporan
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
