# requirements-ci.lock - versi dependensi yang TERBUKTI lulus di CI.
#
# Cara pakai (CI):
#     pip install -r requirements.txt -r requirements-ci.lock
# requirements.txt menentukan RENTANG yang sah; berkas ini memilih versi
# PERSIS di dalam rentang itu, sehingga build CI tidak berubah hanya karena
# upstream merilis versi baru hari itu.
#
# Bukan `pip freeze` mentah. Isinya sengaja:
#   - hanya dependensi tingkat atas dari requirements.txt (transitif tetap
#     diselesaikan pip, yang sekaligus memilih wheel platform yang cocok);
#   - tanpa penanda build lokal seperti `+cu121`, karena penanda itu mengikat
#     berkas ini ke satu mesin ber-GPU dan akan menggagalkan CI (runner CPU);
#   - torch & transformers dikunci pada versi yang BENAR-BENAR diuji, bukan
#     yang terbaru. pip di python 3.11 akan memilih torch 2.14 / transformers
#     5.x bila dibiarkan; keduanya belum pernah dijalankan terhadap kode ini
#     dan transformers 5.x mengubah API. Lock ada justru untuk mencegah itu.
#
# Seluruh baris di bawah diverifikasi pada python 3.11: `mypy` bersih tanpa
# `--python-version`, dan pip dapat menyelesaikan requirements.txt + berkas
# ini tanpa konflik.

